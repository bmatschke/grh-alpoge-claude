name: Publish manuscript
on:
  push:
    branches: [main]
    tags: ['edition-*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a numbered release from the edition file on main'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the manuscript edition
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          REQUEST_RELEASE: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          tag=
          edition=$(cat publication/edition.txt)
          [[ $edition =~ ^edition-[0-9]+(\.[0-9]+)*$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=$GITHUB_REF_NAME
            [[ $tag =~ ^edition-[0-9]+(\.[0-9]+)*$ ]]
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ "$REQUEST_RELEASE" == true ]]; then
              tag=$edition
            elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
              if [[ "$BEFORE" =~ ^0+$ ]]; then
                tag=$edition
              elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- publication/edition.txt; then
                :
              else
                status=$?
                [[ "$status" == 1 ]] || exit "$status"
                tag=$edition
              fi
            fi
          fi
          label="Working edition"
          if [[ -n "$tag" ]]; then label=$tag; fi
          if [[ "$(git rev-parse -q --verify "refs/tags/$edition^{commit}" || true)" == "$GITHUB_SHA" ]]; then
            label=${tag:-$edition}
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - name: Install typesetting tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc lmodern texlive-latex-extra texlive-fonts-recommended
      - name: Verify and build both editions
        env:
          EDITION: ${{ steps.version.outputs.label }}
        run: |
          python3 research/register/verify_selected_family.py
          python3 publication/build.py --edition "$EDITION" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manuscript
          path: publication/build/
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-24.04
    concurrency: manuscript-release-${{ needs.build.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: manuscript
          path: manuscript
      - name: Publish the already built files at the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REVISION: ${{ github.sha }}
        run: bash publication/release.sh manuscript

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/edition-')
    runs-on: ubuntu-24.04
    concurrency: manuscript-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check for an Actions-configured Pages site
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/pages.json" \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) enabled=$(jq -r '.build_type == "workflow"' "$RUNNER_TEMP/pages.json") ;;
            404) enabled=false ;;
            *) cat "$RUNNER_TEMP/pages.json" >&2; exit 1 ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo "Set Settings → Pages → Source to GitHub Actions to deploy the reading site." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          name: manuscript
          path: site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
        if: steps.pages.outputs.enabled == 'true'
